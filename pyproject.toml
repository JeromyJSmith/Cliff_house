[project]
name = "cliff-house"
version = "0.1.0"
description = "Cliff House digital twin: capture inventory, reconstruction, registration and Pixeltable/Marimo workbench"
requires-python = ">=3.12,<3.13"
# Python dependencies live here so the cloud Marimo runtime can install the same set with `uv pip install -e .`
# without pixi; pixi maps them to PyPI locally.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pillow>=11.0",
  "opencv-python-headless>=5.0",
  "pixeltable>=0.4",
  "marimo[recommended,lsp,mcp,otel]>=0.25",
  "huggingface-hub>=1.0",
  # The notebook reads the repository through fsspec's GitHub filesystem (needs requests).
  "fsspec>=2024.6",
  "requests>=2.32",
  # Reads pixi.lock to fingerprint cached native builds.
  "pyyaml>=6.0",
  "trimesh>=4.5",
  "plyfile>=1.1",
  "laspy>=2.5",
  "jsonschema>=4.23",
  # Tabular/spatial layer inside the notebook: Polars + polars-st geometry, DuckDB (spatial extension), GeoParquet via Arrow.
  "polars>=1.30",
  "polars-st>=0.11",
  "duckdb>=1.3",
  "pyarrow>=20",
  "shapely>=2.1",
  "pyproj>=3.7",
  # Decodes the Insta360 .insv trailer (GPS, IMU, exposure, per-lens calibration); handles the Antigravity A1 layout.
  "telemetry-parser>=0.4.0",
]

[project.optional-dependencies]
# SAM 3 masks (Pixeltable's sam3_for_segmentation runs on transformers + torch). molab's kernel installs CUDA builds
# from PyPI via the notebook header; pixi resolves torch from conda-forge, which still builds osx-64.
ml = ["torch>=2.8", "torchvision>=0.23", "transformers>=5.0"]

[project.scripts]
cliff-house-manifest = "cliff_house.source_manifest:main"
cliff-house-verify-upload = "cliff_house.verify_upload:main"
cliff-house-telemetry = "cliff_house.insv_telemetry:main"
cliff-house-remux = "cliff_house.remux:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# osx-64: this iMac. osx-arm64: the MacBook that produced the November evidence. linux-64: cloud Marimo/GPU runtime.
# macOS 14 is the floor of the Qt6/MoltenVK builds that COLMAP 4.2 links.
platforms = [
  { name = "osx-64-macos14", platform = "osx-64", macos = "14.0" },
  { name = "osx-arm64-macos14", platform = "osx-arm64", macos = "14.0" },
  "linux-64",
]

# Native toolchain. These have no usable PyPI wheels for every platform, so conda-forge is their single source.
[tool.pixi.dependencies]
python = "3.12.*"
ffmpeg = ">=7"
# PyPI publishes no osx-64 wheel for OpenCV 5; conda-forge's build satisfies the PyPI requirement instead.
opencv = ">=5.0"
exiftool = "*"
# One Qt and one libav per process: mixed Qt5/Qt6 or a wheel-bundled libav beside conda ffmpeg
# load duplicate Objective-C classes, which macOS warns can crash. Every Qt consumer is pinned to the Qt6 builds,
# and PyAV (pulled in by pixeltable) comes from conda-forge so it links the same ffmpeg.
colmap = { version = ">=4.2", build = "cpu_gpl*" }
pycolmap = { version = ">=4.2", build = "cpu_gpl*" }
openmvs = ">=2.4"
av = "*"
qt6-main = "*"
# Same rule for GEOS/PROJ/Arrow: wheels would bundle second copies beside the conda libs PDAL/Open3D already load,
# and pyproj has no usable osx-64 wheel for this Python.
shapely = "*"
pyproj = "*"
pyarrow = "*"
open3d = "*"
pdal = "*"
git-lfs = ">=3.8"
# marimo[otel] pins opentelemetry-api 1.28.x, which caps importlib-metadata at 8.5.
importlib-metadata = "<=8.5.0"

[tool.pixi.pypi-dependencies]
cliff-house = { path = ".", editable = true }

# Spirula's Linux build is one Vulkan binary needing GLIBCXX_3.4.32, libvulkan, libOpenGL and libgomp; these provide
# them inside the molab session. glibc (>= 2.38) and the NVIDIA Vulkan driver must come from the host.
[tool.pixi.target.linux-64.dependencies]
libvulkan-loader = ">=1.3"
libopengl = "*"
libstdcxx = ">=13"
libgomp = ">=13"
vulkan-tools = "*"
# NVIDIA's Vulkan driver needs the glvnd EGL/GLX dispatch libraries to create an instance headlessly; molab's image
# lacks them (NVIDIA/nvidia-container-toolkit#1952, #191). Xvfb is the documented fallback (a virtual DISPLAY).
libegl = "*"
libglx = "*"
xorg-xvfb-server = "*"

# Spirula from source with its CUDA backend and no GUI: one headless binary needing neither a display nor GL, so it runs
# on hosts whose NVIDIA Vulkan is unusable (molab). Spirula's CUDA side links only cudart; Blackwell (sm_120) needs
# CUDA >= 12.8 and CUDA 12.9 accepts GCC <= 14.
[tool.pixi.feature.spirula-build]
platforms = ["linux-64"]

[tool.pixi.feature.spirula-build.dependencies]
cuda-version = "12.9.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
gxx_linux-64 = "14.*"
cmake = ">=3.18"
ninja = "*"
python = "3.12.*"
git = "*"

# What the cached Spirula CUDA binary needs at run time, without the compiler toolchain.
[tool.pixi.feature.spirula-run]
platforms = ["linux-64"]

[tool.pixi.feature.spirula-run.dependencies]
cuda-version = "12.9.*"
cuda-cudart = "*"
libstdcxx = ">=14"
libgomp = ">=14"

[tool.pixi.feature.ml.dependencies]
pytorch = ">=2.8"
torchvision = ">=0.23"

[tool.pixi.environments]
default = { features = ["dev", "ml"], solve-group = "main" }
# Native tools only — what the notebook installs in a molab session (its kernel already has the Python stack).
native = { features = [], solve-group = "main" }
spirula-build = { features = ["spirula-build"], no-default-feature = true }
spirula-run = { features = ["spirula-run"], no-default-feature = true }

[tool.pixi.tasks]
test = "pytest"
notebook = "marimo edit"
